<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>Card stats — KC Nduaguba</title>
<meta name="theme-color" content="#06231b" />
<style>
  :root{
    --bg:#05201a; --panel:rgba(255,255,255,0.035); --line:rgba(255,205,150,0.18);
    --text:#f6efe3; --dim:rgba(246,239,227,0.66); --accent:#FFD2A0; --accent2:#F2A25A; --bar:rgba(246,239,227,0.22);
    --serif:Georgia,"Times New Roman",serif; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100svh; font-family:var(--sans); color:var(--text);
    background:radial-gradient(120% 80% at 50% -10%, #1c6a4c 0%, #0b3d2e 40%, #05201a 80%) fixed;
    padding:max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    display:flex; justify-content:center;
  }
  main{ width:100%; max-width:760px; }
  header{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  h1{ font-family:var(--serif); font-weight:400; font-size:28px; margin:0; letter-spacing:-0.01em; }
  .sub{ font-size:12.5px; color:var(--dim); margin-top:4px; }
  .range{ display:inline-flex; padding:3px; border:1px solid var(--line); border-radius:999px; background:var(--panel); }
  .range button{ font:650 12px var(--sans); color:var(--text); background:transparent; border:0; border-radius:999px; padding:7px 13px; cursor:pointer; }
  .range button[aria-pressed="true"]{ background:linear-gradient(135deg,#ffe0b8,var(--accent2)); color:#2a1706; }

  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:8px; margin-bottom:14px; }
  .kpi{ padding:14px 12px; border:1px solid var(--line); border-radius:14px; background:var(--panel); }
  .kpi b{ display:block; font-family:var(--serif); font-weight:400; font-size:28px; color:var(--accent); line-height:1.1; }
  .kpi span{ display:block; margin-top:5px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }

  .panel{ border:1px solid var(--line); border-radius:16px; background:var(--panel); padding:16px; margin-bottom:14px; }
  .panel h2{ margin:0 0 12px; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); font-weight:600; }
  .legend{ display:flex; gap:14px; font-size:11.5px; color:var(--dim); margin-bottom:8px; }
  .legend i{ display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
  .chart{ overflow-x:auto; }
  svg text{ fill:var(--dim); font:10px var(--sans); }

  .cols{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  td{ padding:7px 0; border-bottom:1px solid rgba(255,205,150,0.08); }
  td:last-child{ text-align:right; font-variant-numeric:tabular-nums; color:var(--accent); }
  tr:last-child td{ border-bottom:0; }
  .empty{ font-size:13px; color:var(--dim); padding:6px 0; }

  .notice{ border:1px dashed var(--line); border-radius:14px; padding:16px; font-size:13px; line-height:1.6; color:var(--dim); margin-bottom:14px; }
  .notice code{ color:var(--accent); font-size:12px; }
  .notice[hidden]{ display:none; }
  .foot{ text-align:center; font-size:11.5px; color:var(--dim); margin-top:8px; }
  .foot a{ color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Card stats</h1>
      <div class="sub" id="sub">Loading…</div>
    </div>
    <div class="range" id="range" role="group" aria-label="Date range">
      <button data-days="7" aria-pressed="false">7d</button>
      <button data-days="30" aria-pressed="true">30d</button>
      <button data-days="90" aria-pressed="false">90d</button>
    </div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <section class="kpis" id="kpis"></section>

  <section class="panel">
    <h2>Per day</h2>
    <div class="legend"><span><i style="background:var(--bar)"></i>Views</span><span><i style="background:var(--accent)"></i>Contact saves</span></div>
    <div class="chart" id="chart"></div>
  </section>

  <section class="cols">
    <div class="panel"><h2>Actions</h2><div id="events"></div></div>
    <div class="panel"><h2>Sources (?src=)</h2><div id="sources"></div></div>
    <div class="panel"><h2>Language</h2><div id="langs"></div></div>
  </section>

  <p class="foot"><a href="./">← Back to card</a></p>
</main>

<script>
/* =========================================================================
   SETUP
   STATS_URL: an n8n webhook (GET) that returns your logged events as JSON:
     [ { "ts":"2026-10-08T10:15:00Z", "event":"view", "src":"nfc-1", "lang":"en", "detail":"" }, ... ]
   (or { "rows":[ ... ] }). The card POSTs one such row per tap to CONFIG.trackUrl.
   Protect it: add a secret check in n8n and open this page as stats.html?key=YOUR_SECRET
   Try stats.html?demo=1 to preview with sample data.
   ========================================================================= */
const STATS = {
  url:  "https://kcemma.dedyn.io/webhook/card-stats",                    // TODO: your n8n GET webhook URL
  tz:  "Africa/Lagos",
};

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let rows = [], days = 30;

const LABELS = {
  view:'Card views', save:'Contact saves', book:'Book a call', whatsapp:'WhatsApp taps', call:'Calls', email:'Emails',
  cv:'CV downloads', video:'Video taps', share:'Shares', qr:'QR opens', service:'Service taps', work:'Featured work',
  social:'Social taps', install_tap:'Install taps', installed:'Installs', lang:'Language switches', theme:'Theme toggles',
  youtube:'YouTube', linkedin:'LinkedIn', github:'GitHub', x:'X'
};

function demoRows(){
  const out = [], now = Date.now(), ev = ['save','whatsapp','book','cv','video','call','email','service','share'];
  const srcs = ['nfc-1','nfc-1','flyer','linkedin','event-lagos','pwa',''];
  const langs = ['en','en','en','fr','ig'];
  for (let d = 0; d < 60; d++){
    const views = Math.floor(6 + Math.random()*22);
    for (let i = 0; i < views; i++){
      const ts = new Date(now - d*864e5 - Math.random()*864e5).toISOString();
      const src = srcs[Math.floor(Math.random()*srcs.length)], lang = langs[Math.floor(Math.random()*langs.length)];
      out.push({ ts, event:'view', src, lang });
      if (Math.random() < .55) out.push({ ts, event: ev[Math.floor(Math.random()*ev.length)], src, lang });
    }
  }
  return out;
}


function parseTs(v){
  if (v === null || v === undefined || v === '') return NaN;
  if (typeof v === 'number') return v > 20000 && v < 80000 ? Math.round((v - 25569) * 864e5) : v;   // Excel/Sheets serial or epoch ms
  const str = String(v).trim();
  if (/^\d{5}(\.\d+)?$/.test(str)) return Math.round((parseFloat(str) - 25569) * 864e5);
  let t = Date.parse(str);
  if (!isNaN(t)) return t;
  const m = str.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);   // dd/mm/yyyy [hh:mm[:ss]]
  if (m) return new Date(+m[3], +m[2]-1, +m[1], +(m[4]||0), +(m[5]||0), +(m[6]||0)).getTime();
  return NaN;
}
function normalise(list){
  return list.map(x => {
    x = x && x.json ? x.json : x;
    const o = {};
    Object.entries(x || {}).forEach(([k,v]) => { o[String(k).trim().toLowerCase()] = v; });
    o.event = String(o.event || '').trim().toLowerCase();
    o._t = parseTs(o.ts);
    return o;
  });
}

function dayKey(d){ return new Date(d).toLocaleDateString('en-CA', { timeZone: STATS.tz }); }

function count(list, keyFn){
  const m = new Map();
  list.forEach(r => { const k = keyFn(r); m.set(k, (m.get(k)||0) + 1); });
  return [...m.entries()].sort((a,b) => b[1]-a[1]);
}
function table(el, entries, labelFn){
  el.innerHTML = entries.length
    ? '<table>' + entries.map(([k,v]) => `<tr><td>${labelFn ? labelFn(k) : k}</td><td>${v}</td></tr>`).join('') + '</table>'
    : '<div class="empty">No data yet</div>';
}
const esc = s => String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

function render(){
  const since = Date.now() - days*864e5;
  const list = rows.filter(r => r && r.event && !isNaN(r._t) && r._t >= since);
  const c = e => list.filter(r => r.event === e).length;
  const views = c('view'), saves = c('save');

  $('sub').textContent = `Last ${days} days · ${list.length} events`;
  $('kpis').innerHTML = [
    [views,'Views'], [saves,'Saves'], [views ? Math.round(saves/views*100)+'%' : '–','Save rate'],
    [c('whatsapp') + c('service'),'WhatsApp'], [c('book'),'Bookings'], [c('cv'),'CV downloads'],
  ].map(([v,l]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('');

  // per-day series
  const keys = [];
  for (let i = days-1; i >= 0; i--) keys.push(dayKey(Date.now() - i*864e5));
  const v = Object.fromEntries(keys.map(k => [k,0])), s = {...v};
  list.forEach(r => { const k = dayKey(r._t); if (r.event==='view' && k in v) v[k]++; if (r.event==='save' && k in s) s[k]++; });
  const max = Math.max(1, ...keys.map(k => v[k]));
  const bw = Math.max(6, Math.floor(680 / keys.length)), W = bw*keys.length + 30, H = 170, base = H - 22, ph = base - 10;
  let svg = `<svg width="${Math.max(W,320)}" height="${H}" viewBox="0 0 ${Math.max(W,320)} ${H}" role="img" aria-label="Views and saves per day">`;
  svg += `<text x="0" y="12">${max}</text><line x1="26" y1="${base}" x2="${W}" y2="${base}" stroke="rgba(255,205,150,.2)"/>`;
  keys.forEach((k,i) => {
    const x = 28 + i*bw, h1 = v[k]/max*ph, h2 = s[k]/max*ph, w = Math.max(3, bw-3);
    svg += `<rect x="${x}" y="${base-h1}" width="${w}" height="${h1}" rx="2" fill="rgba(246,239,227,.22)"><title>${k}: ${v[k]} views</title></rect>`;
    svg += `<rect x="${x+w*0.2}" y="${base-h2}" width="${w*0.6}" height="${h2}" rx="2" fill="#FFD2A0"><title>${k}: ${s[k]} saves</title></rect>`;
    if (i % Math.ceil(keys.length/8) === 0) svg += `<text x="${x}" y="${H-6}">${k.slice(5)}</text>`;
  });
  $('chart').innerHTML = svg + '</svg>';

  table($('events'), count(list.filter(r => r.event !== 'view'), r => r.event), k => esc(LABELS[k] || k));
  table($('sources'), count(list.filter(r => r.event === 'view'), r => r.src || '(direct)'), esc);
  table($('langs'), count(list.filter(r => r.event === 'view'), r => (r.lang || '?').toUpperCase()), esc);
}

$('range').addEventListener('click', e => {
  const b = e.target.closest('[data-days]'); if (!b) return;
  days = +b.dataset.days;
  [...$('range').children].forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});

async function load(){
  if (params.get('demo')){ rows = normalise(demoRows()); $('sub').textContent = 'Demo data'; render(); return; }
  if (!STATS.url){
    $('notice').hidden = false;
    $('notice').innerHTML = 'Not connected yet. Set <code>STATS.url</code> at the top of this file to your n8n GET webhook, and <code>trackUrl</code> in <code>index.html</code> to your POST webhook. Preview with <code>stats.html?demo=1</code>.';
    render(); return;
  }
  try{
    const u = new URL(STATS.url); const key = params.get('key'); if (key) u.searchParams.set('key', key);
    const r = await fetch(u); if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    const raw = Array.isArray(d) ? d : (d.rows || d.data || []);
    rows = normalise(raw);
    const good = rows.filter(r => r.event && !isNaN(r._t)).length;
    if (raw.length && good < raw.length){
      $('notice').hidden = false;
      $('notice').innerHTML = `Loaded <b>${raw.length}</b> rows from the sheet, but only <b>${good}</b> have a readable <code>ts</code> and <code>event</code>. First row received: <code>${esc(JSON.stringify(raw[0]).slice(0,240))}</code>`;
    } else if (!raw.length){
      $('notice').hidden = false;
      $('notice').textContent = 'Connected, but the sheet returned no rows yet.';
    }
  }catch(e){
    $('notice').hidden = false; $('notice').textContent = 'Could not load stats (check the webhook URL, CORS and key).';
  }
  render();
}
load();
</script>
</body>
</html>
