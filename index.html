<style>
  /* ---------- Design tokens (dark default, light via [data-theme="light"]) ---------- */
  :root{
    --ink:#05201a; --teal:#0b3d2e; --teal-2:#1c6a4c;
    --text:#f6efe3; --text-dim:rgba(246,239,227,0.70);
    --accent:#FFD2A0; --accent-deep:#F2A25A; --ember:#FF8A4C;
    --line:rgba(255,205,150,0.20); --line-soft:rgba(255,205,150,0.11);
    --surface:rgba(255,255,255,0.025); --surface-hover:rgba(255,215,180,0.07);
    --chip-a:rgba(255,210,160,0.10); --chip-b:rgba(255,210,160,0.03);
    --glow:rgba(255,190,120,0.24);
    --h1-a:#f6efe3; --h1-b:#FFD2A0; --h1-c:#F2A25A;
    --bg-1:rgba(255,138,76,0.22); --bg-2:rgba(242,162,90,0.20);
    --field-a:var(--teal-2); --field-b:var(--teal); --field-c:var(--ink);
    --toast-bg:#0a201f; --sheet-bg:#f6efe3; --sheet-text:#0b3d2e; --sheet-sub:#3f6a58;
    --shadow:rgba(0,0,0,0.6);
    --r:16px;
    --serif:Georgia,"Times New Roman","Iowan Old Style",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --text:#0b3d2e; --text-dim:rgba(11,61,46,0.72);
    --accent:#9a4a0c; --accent-deep:#b8610f; --ember:#d9692b;
    --line:rgba(11,61,46,0.20); --line-soft:rgba(11,61,46,0.12);
    --surface:rgba(11,61,46,0.035); --surface-hover:rgba(11,61,46,0.075);
    --chip-a:rgba(11,61,46,0.08); --chip-b:rgba(11,61,46,0.03);
    --glow:rgba(255,170,100,0.32);
    --h1-a:#0b3d2e; --h1-b:#1c6a4c; --h1-c:#9a4a0c;
    --bg-1:rgba(255,138,76,0.20); --bg-2:rgba(28,106,76,0.14);
    --field-a:#fbf3e6; --field-b:#f3e8d6; --field-c:#e9dcc6;
    --toast-bg:#0b3d2e; --sheet-bg:#ffffff; --shadow:rgba(11,61,46,0.28);
    color-scheme:light;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    min-height:100svh; font-family:var(--sans); color:var(--text);
    background:
      radial-gradient(70% 45% at 100% 8%, var(--bg-1), transparent 70%) fixed,
      radial-gradient(80% 50% at 0% 100%, var(--bg-2), transparent 70%) fixed,
      radial-gradient(120% 80% at 50% -10%, var(--field-a) 0%, var(--field-b) 40%, var(--field-c) 80%) fixed;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    display:flex; justify-content:center;
    padding:max(20px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
    transition:color .25s ease;
  }
  .card{
    width:100%; max-width:420px; align-self:center; position:relative;
    padding:38px 26px 26px; border-radius:24px;
    background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0) 40%);
    border:1px solid var(--line);
    box-shadow:0 1px 0 rgba(255,255,255,0.05) inset, 0 30px 70px -30px var(--shadow);
    overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; inset:0;
    background:radial-gradient(65% 34% at 50% 16%, var(--glow), transparent 72%);
    pointer-events:none; transform-origin:50% 15%; will-change:transform, opacity;
  }
  @keyframes glow{ from{ transform:scale(1); opacity:.80; } to{ transform:scale(1.10); opacity:1; } }

  /* ---------- Toolbar: install · language · theme ---------- */
  .toolbar{
    position:absolute; z-index:6; top:12px; left:12px; right:12px;
    display:flex; align-items:center; justify-content:space-between; gap:8px; pointer-events:none;
  }
  .toolbar > *{ pointer-events:auto; }
  .tb-right{ display:flex; align-items:center; gap:6px; margin-left:auto; }
  .pill{
    display:inline-flex; align-items:center; gap:2px; padding:3px; border-radius:999px;
    border:1px solid var(--line); background:rgba(6,32,26,0.55);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  }
  :root[data-theme="light"] .pill{ background:rgba(255,255,255,0.7); }
  .pill button,.iconbtn{
    font-family:var(--sans); font-size:11px; font-weight:650; letter-spacing:0.04em; cursor:pointer;
    color:var(--text); background:transparent; border:0; border-radius:999px; min-width:32px; height:28px; padding:0 8px;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .pill button[aria-pressed="true"]{ background:linear-gradient(135deg,#ffe0b8,var(--accent-deep)); color:#2a1706; }
  .iconbtn{ border:1px solid var(--line); background:rgba(6,32,26,0.55); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); width:34px; height:34px; padding:0; }
  :root[data-theme="light"] .iconbtn{ background:rgba(255,255,255,0.7); }
  .iconbtn svg{ width:16px; height:16px; color:var(--accent); }
  .iconbtn.install{ width:auto; padding:0 12px; font-size:11.5px; height:34px; }
  .iconbtn[hidden]{ display:none; }
  #icoSun{ display:none; } :root[data-theme="light"] #icoSun{ display:block; } :root[data-theme="light"] #icoMoon{ display:none; }

  .eyebrow{ position:relative; text-align:center; font-size:11px; letter-spacing:0.32em; text-transform:uppercase; color:var(--accent); opacity:0.85; margin:0 0 18px; }

  .portrait{ position:relative; margin:-38px -26px 20px; aspect-ratio:4/5; overflow:hidden; background:#0a201f; }
  .portrait[hidden]{ display:none; }
  .portrait img,.portrait video{ width:100%; height:100%; object-fit:cover; object-position:50% 20%; display:block; }
  .portrait::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:40%; background:linear-gradient(180deg, transparent 60%, rgba(6,35,27,0.55)); pointer-events:none; }

  .monogram{
    position:relative; width:104px; height:104px; margin:4px auto 20px; border-radius:50%;
    display:grid; place-items:center; font-family:var(--serif); font-size:38px; color:#2a1706; letter-spacing:0.02em;
    background:linear-gradient(135deg, #ffe2bd 0%, #F2A25A 55%, #FF8A4C 100%);
    box-shadow:0 0 0 5px rgba(255,210,160,0.12), 0 18px 40px -12px rgba(255,138,76,0.55);
  }
  .monogram[hidden]{ display:none; }
  .monogram::after{ content:""; position:absolute; inset:-10px; border-radius:50%; border:1px solid var(--line); pointer-events:none; }

  h1{
    position:relative; font-family:var(--serif); font-weight:400; font-size:34px; line-height:1.06;
    text-align:center; margin:0 0 10px; letter-spacing:-0.01em;
    background:linear-gradient(100deg, var(--h1-a) 30%, var(--h1-b) 75%, var(--h1-c));
    -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
  }
  .role{ position:relative; text-align:center; font-size:13.5px; line-height:1.5; color:var(--text-dim); margin:0 auto 6px; max-width:32ch; }
  .role b{ color:var(--text); font-weight:600; }
  .company{ position:relative; text-align:center; font-size:12.5px; line-height:1.5; color:var(--accent); margin:0 auto 16px; max-width:36ch; }
  .bio{ position:relative; text-align:center; font-size:14px; line-height:1.6; color:var(--text); margin:0 auto 20px; max-width:34ch; }
  .bio:empty,.company:empty{ display:none; }

  .chips{ position:relative; list-style:none; padding:0; margin:0 0 22px; display:flex; flex-wrap:wrap; justify-content:center; gap:7px; }
  .chips li{ font-size:11.5px; color:var(--text); padding:6px 11px; border-radius:999px; background:linear-gradient(180deg, var(--chip-a), var(--chip-b)); border:1px solid var(--line-soft); }
  .cred{ position:relative; display:flex; justify-content:center; margin:-12px auto 22px; }
  .cred[hidden]{ display:none; }
  .cred span{ display:inline-flex; align-items:center; gap:9px; font-size:10.5px; letter-spacing:0.2em; text-transform:uppercase; color:var(--accent); padding:7px 15px; border:1px solid var(--line); border-radius:999px; background:var(--chip-b); }
  .cred span::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--accent); box-shadow:0 0 9px var(--accent); }

  .proof{ position:relative; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 0 22px; }
  .proof:empty{ display:none; }
  .proof div{ text-align:center; padding:11px 6px; border-radius:13px; border:1px solid var(--line-soft); background:var(--surface); }
  .proof b{ display:block; font-family:var(--serif); font-weight:400; font-size:15px; color:var(--accent); margin-bottom:3px; }
  .proof span{ display:block; font-size:10.5px; line-height:1.35; color:var(--text-dim); }

  .save,.book{
    position:relative; width:100%; cursor:pointer; font-family:var(--sans); font-size:15px; font-weight:650; letter-spacing:0.01em;
    min-height:52px; padding:16px 18px; border-radius:var(--r);
    display:flex; align-items:center; justify-content:center; gap:10px; text-decoration:none;
    transition:transform .12s ease, box-shadow .2s ease, filter .2s ease, background .18s ease;
  }
  .save{ border:0; color:#2a1706; background:linear-gradient(135deg, #ffe0b8 0%, #FFD2A0 35%, #F2A25A 100%); box-shadow:0 14px 34px -12px rgba(255,138,76,0.55); }
  .save:hover{ filter:brightness(1.03); }
  .book{ margin-top:8px; color:var(--accent); border:1px solid var(--accent-deep); background:var(--chip-b); }
  .book:hover{ background:var(--surface-hover); }
  .book[hidden],.cv[hidden]{ display:none; }
  .save:active,.book:active{ transform:translateY(1px) scale(0.995); }
  .save svg,.book svg{ width:18px; height:18px; }

  .actions{ position:relative; display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .actions[hidden]{ display:none; }
  .actions button,.cv{
    display:flex; align-items:center; justify-content:center; gap:8px; padding:13px 10px; min-height:48px; border-radius:13px;
    border:1px solid var(--line); background:var(--surface); color:var(--text);
    font-family:var(--sans); font-size:13px; font-weight:600; letter-spacing:0.01em; cursor:pointer; text-decoration:none;
    transition:background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .cv{ position:relative; margin-top:8px; width:100%; }
  .actions button:active,.cv:active{ transform:translateY(1px); }
  .actions button:hover,.cv:hover{ background:var(--surface-hover); }
  .actions svg,.cv svg{ width:17px; height:17px; color:var(--accent); }

  .quick{ position:relative; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
  .quick a{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:13px 6px; border-radius:13px; border:1px solid var(--line); background:var(--surface); color:var(--text); text-decoration:none; font-size:11.5px; letter-spacing:0.02em; transition:background .18s ease, transform .12s ease; }
  .quick a:active{ transform:translateY(1px); }
  .quick a:hover{ background:var(--surface-hover); }
  .quick svg{ width:19px; height:19px; color:var(--accent); }

  .sep{ position:relative; display:flex; align-items:center; gap:12px; margin:26px 2px 14px; color:var(--accent); font-size:10.5px; letter-spacing:0.26em; text-transform:uppercase; opacity:0.85; }
  .sep::before,.sep::after{ content:""; height:1px; flex:1; background:var(--line-soft); }
  .sep[hidden],.services[hidden],.work[hidden],.video[hidden]{ display:none; }

  .services{ position:relative; display:flex; flex-direction:column; gap:8px; }
  .service{
    display:flex; gap:14px; align-items:flex-start; padding:14px 15px; border-radius:14px;
    border:1px solid var(--line-soft); background:var(--surface); color:var(--text); text-decoration:none;
    transition:background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .service:hover{ background:var(--surface-hover); border-color:var(--line); }
  .service:active{ transform:translateY(1px); }
  .service .ic{ width:22px; height:22px; flex:none; color:var(--accent); margin-top:1px; }
  .service .ic svg{ width:22px; height:22px; }
  .service .name{ font-size:14px; font-weight:600; margin-bottom:2px; }
  .service .sub{ font-size:12.5px; line-height:1.45; color:var(--text-dim); }
  .service .go{ margin-left:auto; color:var(--accent); opacity:.55; align-self:center; }
  .service .go svg{ width:16px; height:16px; }

  /* latest video tile */
  .video{ position:relative; display:block; border-radius:16px; overflow:hidden; border:1px solid var(--line); background:var(--surface); color:var(--text); text-decoration:none; }
  .video .thumb{ position:relative; aspect-ratio:16/9; background:#0a201f center/cover no-repeat; }
  .video .thumb::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 55%, rgba(0,0,0,.45)); }
  .video .play{ position:absolute; z-index:1; left:50%; top:50%; width:54px; height:54px; transform:translate(-50%,-50%); border-radius:50%; display:grid; place-items:center; background:linear-gradient(135deg,#ffe0b8,#F2A25A); box-shadow:0 10px 30px -8px rgba(0,0,0,.6); }
  .video .play svg{ width:22px; height:22px; color:#2a1706; margin-left:3px; }
  .video .meta{ padding:12px 14px 14px; }
  .video .meta .tag{ font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); margin-bottom:4px; }
  .video .meta .ttl{ font-size:14px; font-weight:600; line-height:1.35; }
  .video.skeleton .thumb{ background:linear-gradient(110deg, rgba(255,255,255,.04) 30%, rgba(255,255,255,.1) 50%, rgba(255,255,255,.04) 70%); background-size:200% 100%; animation:shimmer 1.4s linear infinite; }
  @keyframes shimmer{ to{ background-position:-200% 0; } }

  .socials,.work{ position:relative; display:flex; flex-direction:column; gap:8px; }
  .social{
    display:flex; align-items:center; gap:14px; padding:14px 15px; min-height:56px; border-radius:14px;
    border:1px solid var(--line-soft); background:var(--surface); color:var(--text); text-decoration:none;
    transition:background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .social:active{ transform:translateY(1px); }
  .social:hover{ background:var(--surface-hover); border-color:var(--line); }
  .social .ic{ width:22px; height:22px; flex:none; color:var(--accent); display:grid; place-items:center; }
  .social .ic svg{ width:20px; height:20px; }
  .social .tx{ display:flex; flex-direction:column; line-height:1.25; }
  .social .tx .name{ font-size:14px; font-weight:600; }
  .social .tx .sub{ font-size:12px; color:var(--text-dim); }
  .social .go{ margin-left:auto; color:var(--accent); opacity:0.55; }
  .social .go svg{ width:16px; height:16px; }

  footer{ position:relative; margin-top:24px; text-align:center; font-size:11px; line-height:1.6; letter-spacing:0.04em; color:var(--text-dim); }

  #qrModal{ position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; padding:24px; background:rgba(6,22,21,0.72); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
  #qrModal.show{ display:flex; }
  #qrModal .sheet{ background:var(--sheet-bg); border-radius:22px; padding:22px 22px 18px; max-width:320px; width:100%; text-align:center; box-shadow:0 30px 70px -20px rgba(0,0,0,0.7); }
  #qrModal .sheet h3{ margin:0 0 4px; font-family:var(--serif); font-weight:400; font-size:20px; color:var(--sheet-text); }
  #qrModal .sheet p{ margin:0 0 14px; font-size:12px; color:var(--sheet-sub); word-break:break-all; }
  #qrModal .qrbox svg{ width:100%; height:auto; display:block; border-radius:10px; }
  #qrModal .close{ margin-top:14px; width:100%; border:0; border-radius:12px; cursor:pointer; padding:11px; font-family:var(--sans); font-size:13px; font-weight:650; color:#f6efe3; background:#0b3d2e; }

  #toast{ position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px); background:var(--toast-bg); color:#f6efe3; border:1px solid var(--line); padding:12px 16px; border-radius:12px; font-size:13px; max-width:88vw; box-shadow:0 20px 50px -20px rgba(0,0,0,0.7); opacity:0; pointer-events:none; transition:opacity .22s ease, transform .22s ease; z-index:70; }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }

  @media (prefers-reduced-motion:no-preference){
    .reveal{ opacity:0; transform:translateY(10px); animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise{ to{ opacity:1; transform:none; } }
    .card::before{ animation:glow 14s ease-in-out infinite alternate; }
  }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:8px; }
</style>

  <main class="card" id="card">

      <button class="iconbtn install" id="installBtn" type="button" data-evt="install_tap" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>

          <svg id="icoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg id="icoSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>

    <div class="portrait reveal" id="portrait" hidden></div>
    <div class="monogram reveal" id="monogram" aria-hidden="true">KC</div>
    <p class="eyebrow reveal" id="eyebrow">Lagos · Nigeria</p>

    <p class="bio reveal" id="bio"></p>
    <ul class="chips reveal" id="chips" aria-label="Skills"></ul>

    <button class="save reveal" id="saveBtn" type="button" data-evt="save">

      <span id="saveLabel">Save my contact</span>

      <span id="bookLabel">Book a free call</span>

};

/* ---- Language ---- */
function detectLang(){
  const ok = CONFIG.languages.filter(l => LANG[l]);
  const q = params.get('lang'); if (q && ok.includes(q)) return q;
  const s = store.get('kc-lang'); if (s && ok.includes(s)) return s;
  const n = (navigator.language || 'en').slice(0,2).toLowerCase();
  return ok.includes(n) ? n : ok[0];
}

/* ---- Tracking (Plausible + optional own webhook) ---- */
(function(){
  window.plausible = window.plausible || function(){ (window.plausible.q = window.plausible.q || []).push(arguments); };
  if (!CONFIG.plausibleDomain) return;
  const s = document.createElement('script');
  s.defer = true; s.dataset.domain = CONFIG.plausibleDomain; s.src = 'https://plausible.io/js/script.js';
  document.head.appendChild(s);
})();
function track(event, extra){
  try{ window.plausible(event); }catch(e){}
  if (!CONFIG.trackUrl) return;
  try{
    const body = JSON.stringify({ event, src: SRC, lang, ts: new Date().toISOString(), detail: extra || '' });
    if (navigator.sendBeacon) navigator.sendBeacon(CONFIG.trackUrl, new Blob([body], { type:'text/plain' }));
    else fetch(CONFIG.trackUrl, { method:'POST', body, keepalive:true, mode:'no-cors' });
  }catch(e){}
}

  if (key==='whatsapp' && CONFIG.whatsapp) return {ic:'whatsapp', label:T.whatsapp, href:waLink(T.waDefault), evt:'whatsapp'};
  if (key==='email'    && CONFIG.email)    return {ic:'mail',     label:T.email,    href:'mailto:'+CONFIG.email, evt:'email'};
  const s = CONFIG.socials.find(x => x.key===key && x.url && x.url.trim());
  return s ? {ic:s.key, label:s.name, href:s.url, evt:key} : null;
}

      <span class="tx"><span class="name">${esc(name)}</span><span class="sub">${esc(sub||'')}</span></span>

}

  }
  if (CONFIG.cvUrl && CONFIG.cvUrl.trim()){
    $('cvBtn').href = CONFIG.cvUrl; $('cvBtn').setAttribute('download', `${CONFIG.fullName} CV.pdf`); $('cvBtn').hidden = false;
  }

  $('quick').innerHTML = (CONFIG.quickActions||[]).map(resolveAction).filter(Boolean).map(q =>
    `<a href="${esc(q.href)}" ${q.href.startsWith('http') ? 'target="_blank" rel="noopener"' : ''} data-evt="${esc(q.evt)}">${ICONS[q.ic] || ICONS.globe}<span>${esc(q.label)}</span></a>`
  ).join('');

  // Services — each opens WhatsApp with a topic-specific pre-filled message
  $('servicesSep').textContent = T.servicesSep;
  $('services').innerHTML = T.services.map((s, i) => {
    const href = CONFIG.whatsapp ? waLink(T.waTopic.replace('{topic}', s[2])) : '#';
    return `<a class="service" href="${esc(href)}" target="_blank" rel="noopener" data-evt="service" data-detail="${esc(s[2])}">
      <span class="ic">${ICONS[CONFIG.serviceIcons[i]] || ICONS.globe}</span>
      <div><div class="name">${esc(s[0])}</div><div class="sub">${esc(s[1])}</div></div>
      <span class="go">${ARROW}</span></a>`;
  }).join('');

  // Featured work
  $('workSep').textContent = T.workSep;
  const feat = T.featured.map((f, i) => ({ title:f[0], sub:f[1], url:CONFIG.featuredUrls[i] })).filter(f => f.url);
  $('work').hidden = $('workSep').hidden = !feat.length;
  $('work').innerHTML = feat.map(f => linkRow(f.url, ICONS.globe, f.title, f.sub, 'work', f.title)).join('');

  // Socials
  $('followSep').textContent = T.followSep;
  $('socials').innerHTML = CONFIG.socials.filter(s => s.url && s.url.trim())
    .map(s => linkRow(s.url, ICONS[s.key] || ICONS.globe, s.name, s.sub, 'social', s.name)).join('');

  $('footer').innerHTML = T.footer.replace('{rc}', esc(CONFIG.rcNumber || ''));

  // Video tile text
  $('videoSep').textContent = T.videoSep;
  $('vTag').textContent = T.videoTag;
  if (!videoState.title) $('vTitle').textContent = T.videoFallbackTitle;

  // Language pill
  $('langPill').innerHTML = CONFIG.languages.filter(l => LANG[l]).map(l =>
    `<button type="button" data-lang="${l}" aria-pressed="${l === lang}" aria-label="${LANG[l].label}">${LANG[l].label}</button>`).join('');
}
$('langPill').addEventListener('click', e => {
  const b = e.target.closest('[data-lang]');
  if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang; store.set('kc-lang', lang); track('lang', lang); render();
});

/* ---- Static bits (don't change with language) ---- */
$('monogram').textContent = CONFIG.initials || (CONFIG.firstName[0] + CONFIG.lastName[0]);
$('name').textContent = CONFIG.fullName;
$('chips').innerHTML = (CONFIG.tags||[]).map(x => `<li>${esc(x)}</li>`).join('');
(function(){
  const el = $('eyebrow'), city = CONFIG.location.city;
  function tick(){
    let tm = '';
    try{ tm = new Date().toLocaleTimeString([], { hour:'numeric', minute:'2-digit', timeZone: CONFIG.location.tz }); }catch(e){}
    el.textContent = [city, tm].filter(Boolean).join(' · ');
  }
  tick(); setInterval(tick, 30000);
})();

/* ---- Latest YouTube video ---- */
const videoState = { title:'' };
(function(){
  const yt = CONFIG.youtube || {};
  const tile = $('video');
  if (!yt.channelUrl && !yt.channelId){ return; }
  tile.hidden = false; $('videoSep').hidden = false;
  tile.href = yt.channelUrl || `https://www.youtube.com/channel/${yt.channelId}`;
  if (!yt.channelId){ tile.classList.remove('skeleton'); return; }
  const feed = `https://www.youtube.com/feeds/videos.xml?channel_id=${yt.channelId}`;
  const api  = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed)}`;
  const ctl = new AbortController(); setTimeout(() => ctl.abort(), 6000);
  fetch(api, { signal: ctl.signal }).then(r => r.json()).then(d => {
    const it = d && d.items && d.items[0];
    if (!it) throw new Error('no items');
    const id = (it.guid || '').split(':').pop() || (it.link.match(/v=([\w-]{11})/) || [])[1];
    tile.href = it.link || `https://www.youtube.com/watch?v=${id}`;
    if (id) $('vThumb').style.backgroundImage = `url(https://i.ytimg.com/vi/${id}/hqdefault.jpg)`;
    videoState.title = it.title; $('vTitle').textContent = it.title;
  }).catch(() => {}).finally(() => tile.classList.remove('skeleton'));
})();

/* ---- Portrait with graceful fallback ---- */
(function(){
  const p = CONFIG.portrait || {}, el = $('portrait'), mono = $('monogram');
  const src = p.video || p.image;
  if (!src) return;
  function showMono(){ el.hidden = true; el.innerHTML = ''; mono.hidden = false; $('card').classList.remove('has-portrait'); }
  function showPortrait(){ el.hidden = false; mono.hidden = true; $('card').classList.add('has-portrait'); }
  let node;
  if (p.video){
    node = document.createElement('video');
    node.src = p.video; if (p.poster) node.poster = p.poster;
    node.autoplay = true; node.muted = true; node.loop = true; node.playsInline = true;
    node.addEventListener('loadeddata', showPortrait);
  } else {
    node = document.createElement('img'); node.alt = CONFIG.fullName;
    node.addEventListener('load', showPortrait); node.src = p.image;
  }
  node.addEventListener('error', showMono);
  el.appendChild(node);
})();

/* ---- vCard ---- */
const vEsc = s => String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
function fold(line){
  if (line.length <= 74) return line;
  const out = [line.slice(0,75)];
  for (let i = 75; i < line.length; i += 74) out.push(' ' + line.slice(i, i + 74));
  return out.join('\r\n');
}
function getPhotoB64(){
  return new Promise(resolve => {
    const src = CONFIG.portrait && CONFIG.portrait.image;
    if (!src) return resolve('');
    const img = new Image();
    img.onload = () => {
      try{
        const size = 256, c = document.createElement('canvas'); c.width = c.height = size;
        const s = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - s)/2, Math.max(0,(img.height - s)*0.2), s, s, 0, 0, size, size);
        resolve(c.toDataURL('image/jpeg', 0.82).split(',')[1] || '');
      }catch(e){ resolve(''); }
    };
    img.onerror = () => resolve(''); img.src = src;
  });
}
async function buildVCard(){
  const L = CONFIG.location, photo = await getPhotoB64();
  const lines = [
    'BEGIN:VCARD', 'VERSION:3.0',
    `N:${vEsc(CONFIG.lastName)};${vEsc(CONFIG.firstName)};;;`,
    `FN:${vEsc(CONFIG.fullName)}`,
    CONFIG.org ? `ORG:${vEsc(CONFIG.org)}` : '',
    CONFIG.title ? `TITLE:${vEsc(CONFIG.title)}` : '',
    CONFIG.phone ? `TEL;TYPE=CELL,VOICE:${CONFIG.phone}` : '',
    CONFIG.email ? `EMAIL;TYPE=INTERNET,WORK:${CONFIG.email}` : '',
    CONFIG.website ? `URL:${CONFIG.website}` : '',
    `ADR;TYPE=WORK:;;;${vEsc(L.city)};${vEsc(L.region)};;${vEsc(L.country)}`,
    CONFIG.note ? `NOTE:${vEsc(CONFIG.note)}` : '',
    photo ? `PHOTO;ENCODING=b;TYPE=JPEG:${photo}` : '',
  ];
  let n = 1;
  if (CONFIG.whatsapp){ lines.push(`item${n}.URL:https://wa.me/${CONFIG.whatsapp}`, `item${n}.X-ABLabel:WhatsApp`); n++; }
  if (CONFIG.bookingUrl && CONFIG.bookingUrl.trim() && !/YOUR-USERNAME/.test(CONFIG.bookingUrl)){ lines.push(`item${n}.URL:${CONFIG.bookingUrl}`, `item${n}.X-ABLabel:Book a call`); n++; }
  CONFIG.socials.filter(s => s.url && s.url.trim()).forEach(s => { lines.push(`item${n}.URL:${s.url}`, `item${n}.X-ABLabel:${vEsc(s.name)}`); n++; });
  lines.push(`REV:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'')}`, 'END:VCARD');
  return lines.filter(Boolean).map(fold).join('\r\n');
}

function toast(msg){
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 3600);
}

$('saveBtn').addEventListener('click', async () => {
  try{
    const blob = new Blob([await buildVCard()], { type:'text/vcard;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `${CONFIG.fullName}.vcf`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast(t().tSaved);
  }catch(e){ toast(t().tSaveFail); }
});

/* ---- Share + QR ---- */
(function(){
  const wrap = $('actions'), shareBtn = $('shareBtn'), qrBtn = $('qrBtn');
  if (!CONFIG.showShare) shareBtn.remove();
  if (!CONFIG.showQR) qrBtn.remove();
  if (!CONFIG.showShare && !CONFIG.showQR){ wrap.hidden = true; return; }
  if (!!CONFIG.showShare !== !!CONFIG.showQR) wrap.style.gridTemplateColumns = '1fr';

  if (CONFIG.showShare){
    shareBtn.addEventListener('click', async () => {
      try{
        if (navigator.share) await navigator.share({ title: CONFIG.fullName, text: `${CONFIG.fullName} — ${CONFIG.title}`, url: location.origin + location.pathname });
        else { await navigator.clipboard.writeText(location.origin + location.pathname); toast(t().tCopied); }
      }catch(e){}
    });
  }
  if (CONFIG.showQR){
    const modal = $('qrModal'), box = $('qrbox');
    const openQR = () => {
      const url = location.origin + location.pathname;
      $('qrUrl').textContent = url;
      if (box.dataset.rendered !== url){
        try{
          if (typeof qrcode !== 'function') throw new Error('qr lib missing');
          const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
          let svg;
          try{ svg = qr.createSvgTag({ cellSize: 8, margin: 12, scalable: true }); } catch(e){ svg = qr.createSvgTag(8, 12); }
          svg = svg.replace(/fill="white"/g, 'fill="#FBF1E6"').replace(/fill="black"/g, 'fill="#0b3d2e"');
          box.innerHTML = svg; box.dataset.rendered = url;
        }catch(e){ box.innerHTML = `<p>${esc(t().qrOffline)}</p>`; }
      }
      modal.classList.add('show'); modal.setAttribute('aria-hidden','false');
    };
    const closeQR = () => { modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); };
    qrBtn.addEventListener('click', openQR);
    $('qrClose').addEventListener('click', closeQR);
    modal.addEventListener('click', e => { if (e.target === modal) closeQR(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeQR(); });
  }
})();

/* ---- PWA: service worker + install button ---- */
(function(){
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  const btn = $('installBtn');
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone) return;
  let deferred = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; btn.hidden = false; });
  window.addEventListener('appinstalled', () => { btn.hidden = true; deferred = null; track('installed'); });
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  if (isIOS) btn.hidden = false;   // iOS has no install event; show a hint instead
  btn.addEventListener('click', async () => {
    if (deferred){ deferred.prompt(); try{ await deferred.userChoice; }catch(e){} deferred = null; btn.hidden = true; }
    else if (isIOS) toast(t().installIos);
  });
})();

render();
</script>
